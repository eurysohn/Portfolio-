# fly.toml app configuration file generated for enterprise-text-to-sql-agent-ui on 2026-02-01T21:51:44+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'enterprise-text-to-sql-agent-ui'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_AGENT_API_URL = "https://enterprise-text-to-sql-agent.fly.dev"

[env]
  NEXT_PUBLIC_AGENT_API_URL = "https://enterprise-text-to-sql-agent.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
