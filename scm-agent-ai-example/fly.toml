app = "scm-agent-ai-example-eury"
primary_region = "sin"

[env]
  ENV = "prod"
  REQUIRE_API_KEY = "true"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
